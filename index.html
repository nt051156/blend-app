<!DOCTYPE html>
<html lang="ja" style="overflow-x:hidden;width:100%;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLEND | シングルオイル図鑑</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
:root{--bg:#F7F4EF;--surface:#FFFFFF;--border:#E0D8CC;--text:#2C2416;--sub:#7A6E5F;--accent:#5C7A3E;--ok:#4A7C2F;--caution:#C8861A;--ng:#B03030;--tag-bg:#EDF3E8;--tag-text:#3D6628;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;width:100%;}

/* ヘッダー */
header{background:var(--text);padding:0;position:sticky;top:0;z-index:100;width:100%;overflow:hidden;}
.header-inner{padding:12px 16px;display:flex;align-items:baseline;gap:10px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#F7F4EF;letter-spacing:3px;}
.logo-sub{font-size:11px;color:#A09080;letter-spacing:1px;}

/* タブ */
.tabs{display:flex;border-top:1px solid rgba(255,255,255,0.1);}
.tab-btn{flex:1;padding:10px 0;font-size:12px;font-weight:700;color:#A09080;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Noto Sans JP',sans-serif;letter-spacing:0.5px;transition:color 0.15s,border-color 0.15s;}
.tab-btn.active{color:#F7F4EF;border-bottom-color:#5C7A3E;}

/* 検索 */
.search-bar{padding:12px 14px 10px;position:sticky;top:89px;z-index:90;background:var(--bg);border-bottom:1px solid var(--border);width:100%;overflow:hidden;}
.search-bar input{width:100%;padding:10px 16px;border:1.5px solid var(--border);border-radius:24px;font-size:16px;background:var(--surface);color:var(--text);outline:none;font-family:'Noto Sans JP',sans-serif;-webkit-appearance:none;}
.search-bar input:focus{border-color:var(--accent);}
.count-bar{font-size:11px;color:var(--sub);padding:5px 16px 2px;}

/* カードグリッド */
.card-grid{padding:8px 10px 80px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;min-width:0;}
.oil-card{background:var(--surface);border-radius:14px;border:1.5px solid var(--border);padding:13px 11px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:0;overflow:hidden;}
.oil-card:active{background:#EDF3E8;}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px;gap:4px;}
.card-names{flex:1;min-width:0;}
.card-ja{font-size:14px;font-weight:700;color:var(--accent);line-height:1.3;word-break:break-all;}
.card-en{font-family:'Cormorant Garamond',serif;font-size:12px;color:#5A4E40;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;letter-spacing:0.3px;}
.dil-badge{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;font-size:10px;font-weight:700;flex-shrink:0;}
.dil-N{background:#DDF0D0;color:#2D6A1E;}
.dil-S{background:#FFF0C0;color:#8A5E00;}
.dil-D{background:#FFD8C8;color:#8A2000;}
.card-benefits{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;}
.card-benefit{font-size:11px;color:var(--sub);padding:3px 7px;background:var(--bg);border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-safety{display:flex;gap:4px;align-items:center;}
.safety-pill{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700;border:1px solid;}
.sp-ok{color:var(--ok);background:#EDF6E8;border-color:#B8DCAA;}
.sp-warn{color:var(--caution);background:#FFF6E0;border-color:#E8C870;}
.sp-ng{color:var(--ng);background:#FFF0F0;border-color:#EEAAAA;}
.card-note{font-size:10px;color:#B0A090;margin-left:auto;white-space:nowrap;}
.empty-state{text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;grid-column:1/-1;}
.empty-state .e-icon{font-size:36px;display:block;margin-bottom:10px;}

/* レシピタブ */
.recipe-wrap{padding:8px 12px 80px;display:none;}
.recipe-wrap.active{display:block;}
.recipe-category{margin-bottom:20px;}
.recipe-cat-title{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;padding:12px 4px 6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.recipe-card{background:var(--surface);border-radius:14px;border:1.5px solid var(--border);padding:14px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.recipe-card:active{background:#EDF3E8;}
.recipe-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.recipe-emoji{font-size:24px;flex-shrink:0;}
.recipe-name{font-size:15px;font-weight:700;color:var(--text);}
.recipe-usage-tag{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--tag-bg);color:var(--tag-text);border:1px solid #C8DFB8;margin-left:auto;white-space:nowrap;}
.recipe-desc{font-size:12px;color:var(--sub);margin-bottom:10px;line-height:1.6;}
.recipe-oils{display:flex;flex-wrap:wrap;gap:5px;}
.recipe-oil-chip{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);}
.recipe-oil-ratio{font-weight:700;color:var(--accent);margin-left:3px;}

/* ビルダータブ */
.builder-wrap{padding:8px 12px 100px;display:none;}
.builder-wrap.active{display:block;}
.builder-section{background:var(--surface);border-radius:14px;border:1.5px solid var(--border);padding:14px;margin-bottom:12px;}
.builder-title{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:10px;}
.oil-select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;}
.oil-select-btn{padding:12px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;color:var(--text);cursor:pointer;text-align:left;font-family:'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;min-height:44px;}
.oil-select-btn.selected{border-color:var(--accent);background:var(--tag-bg);color:var(--accent);font-weight:700;}
.oil-select-btn:active{background:#E0EDD8;}
.builder-selected{display:flex;flex-direction:column;gap:10px;}
.builder-oil-row{display:flex;align-items:center;gap:10px;}
.builder-oil-name{font-size:13px;font-weight:700;color:var(--text);min-width:80px;flex:1;}
.builder-ratio-ctrl{display:flex;align-items:center;gap:8px;}
.ratio-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);-webkit-tap-highlight-color:transparent;line-height:1;}
.ratio-btn:active{background:var(--bg);}
.ratio-val{font-size:16px;font-weight:700;color:var(--accent);min-width:20px;text-align:center;}
.builder-remove{width:26px;height:26px;border-radius:50%;border:1px solid #E0D8CC;background:none;color:var(--sub);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.total-input-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.total-label{font-size:13px;color:var(--text);flex:1;}
.total-input{width:80px;padding:7px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;text-align:center;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--surface);}
.total-unit{font-size:12px;color:var(--sub);}
.result-list{display:flex;flex-direction:column;gap:6px;}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--tag-bg);border-radius:10px;}
.result-oil{font-size:13px;color:var(--tag-text);font-weight:500;}
.result-drops{font-size:18px;font-weight:700;color:var(--accent);}
.result-drops span{font-size:12px;font-weight:400;color:var(--sub);}
.result-pct{font-size:11px;color:var(--sub);margin-left:6px;}
.builder-hint{font-size:11px;color:var(--sub);padding:8px 4px;line-height:1.7;}
.load-recipe-btn{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-bottom:8px;-webkit-tap-highlight-color:transparent;}
.load-recipe-btn:active{background:var(--tag-bg);}

/* モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,36,22,0.55);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);width:100%;max-width:600px;max-height:92vh;border-radius:20px 20px 0 0;overflow-y:auto;padding:0 0 48px;animation:slideUp 0.22s ease;-webkit-overflow-scrolling:touch;}
@keyframes slideUp{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
.modal-close-row{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px 14px;background:var(--surface);z-index:10;}
.modal-close-btn{background:none;border:1.5px solid var(--border);border-radius:20px;padding:10px 20px;font-size:13px;color:var(--sub);cursor:pointer;font-family:'Noto Sans JP',sans-serif;min-height:44px;}
.modal-body{padding:0 18px;}
.modal-title-en{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--sub);margin-bottom:2px;}
.modal-title-ja{font-size:28px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.2;}
.scent-desc{background:var(--bg);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;line-height:1.7;border-radius:0 8px 8px 0;margin-bottom:16px;}
.note-tag{display:inline-block;background:var(--text);color:#F7F4EF;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin:18px 0 8px;}
.benefits-list{display:flex;flex-direction:column;gap:5px;}
.benefit-item{font-size:13px;padding:7px 12px;background:var(--tag-bg);border-radius:8px;color:var(--tag-text);line-height:1.4;}
.usage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.usage-item{text-align:center;padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);font-size:11px;}
.usage-item .u-icon{font-size:20px;display:block;margin-bottom:3px;}
.usage-item.active{border-color:var(--accent);background:var(--tag-bg);}
.usage-item.inactive{opacity:0.3;}
.safety-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.safety-item{text-align:center;padding:12px 4px;border-radius:10px;border:1.5px solid var(--border);}
.safety-item .s-icon{font-size:22px;display:block;margin-bottom:3px;}
.safety-item .s-label{font-size:11px;color:var(--sub);}
.safety-item .s-value{font-size:18px;font-weight:700;display:block;margin:2px 0;}
.safety-item .s-desc{font-size:10px;}
.safety-item.s-ok{border-color:var(--ok);background:#EDF6E8;}
.safety-item.s-warn{border-color:var(--caution);background:#FFF6E0;}
.safety-item.s-ng{border-color:var(--ng);background:#FFF0F0;}
.s-ok .s-value{color:var(--ok);}
.s-warn .s-value{color:var(--caution);}
.s-ng .s-value{color:var(--ng);}
.caution-box{background:#FFF8F0;border:1.5px solid #E8C89A;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.8;color:#6A4010;margin-top:8px;}
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:12px;padding:4px 12px;border-radius:14px;background:#F0EDE6;color:var(--sub);border:1px solid var(--border);}
.blend-chips{display:flex;flex-wrap:wrap;gap:6px;}
.blend-chip{font-size:12px;padding:11px 16px;border-radius:16px;background:var(--text);color:#F7F4EF;cursor:pointer;border:none;font-family:'Noto Sans JP',sans-serif;min-height:44px;}
.blend-chip:active{background:var(--accent);}

/* レシピ詳細モーダル */
.recipe-modal-oils{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.rmo-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--tag-bg);border-radius:10px;}
.rmo-name{font-size:14px;font-weight:700;color:var(--tag-text);}
.rmo-ratio{font-size:13px;color:var(--sub);}
.use-in-builder-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:8px;}
.use-in-builder-btn:active{background:#4A6830;}

.warn-box{background:#FFF6E0;border:1.5px solid #E8C870;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#7A5800;}
.warn-text{display:block;margin-bottom:6px;}
.warn-btn{padding:6px 14px;border-radius:8px;border:1.5px solid #C8861A;background:#FFF6E0;color:#7A5800;font-size:12px;font-weight:700;cursor:pointer;min-height:44px;}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="logo">BLEND</span>
    <span class="logo-sub">シングルオイル図鑑</span>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-catalog" onclick="switchTab('catalog')">図鑑</button>
    <button class="tab-btn" id="tab-recipe" onclick="switchTab('recipe')">レシピ</button>
    <button class="tab-btn" id="tab-builder" onclick="switchTab('builder')">ビルダー</button>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="おなか・頭痛・ねむれない・花粉…" autocomplete="off" autocorrect="off" spellcheck="false">
</div>
<div class="count-bar" id="countBar"></div>

<!-- 図鑑 -->
<div id="view-catalog">
  <div class="card-grid" id="cardGrid"></div>
</div>

<!-- レシピ -->
<div id="view-recipe" style="display:none;padding:8px 12px 80px;width:100%;overflow-x:hidden;"></div>

<!-- ビルダー -->
<div id="view-builder" style="display:none;padding:8px 12px 100px;width:100%;overflow-x:hidden;">
  <div class="builder-section">
    <div class="builder-title">STEP 1 　オイルを選ぶ（最大5種）</div>
    <div class="oil-select-grid" id="oilSelector"></div>
  </div>
  <div class="builder-section">
    <div class="builder-title">STEP 2 　比率を決める</div>
    <div class="builder-selected" id="builderSelected"></div>
  </div>
  <div class="builder-section">
    <div class="builder-title">STEP 3 　合計滴数を入力</div>
    <div class="total-input-row">
      <span class="total-label">ディフューザーに入れる総滴数</span>
      <input class="total-input" type="number" id="totalDrops" value="6" min="1" max="30">
      <span class="total-unit">滴</span>
    </div>
    <div class="builder-hint">※芳香浴は通常6〜8滴。塗布用ロールオンは10〜15滴が目安</div>
  </div>
  <div class="builder-section">
    <div class="builder-title">計算結果</div>
    <div id="resultArea"></div>
  </div>
</div>

<!-- 図鑑モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent">
    <div class="modal-handle"></div>
    <div class="modal-close-row"><button class="modal-close-btn" onclick="closeModal()">閉じる ✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- レシピモーダル -->
<div class="modal-overlay" id="recipeModal">
  <div class="modal" id="recipeModalContent">
    <div class="modal-handle"></div>
    <div class="modal-close-row"><button class="modal-close-btn" onclick="closeModal()">閉じる ✕</button></div>
    <div class="modal-body" id="recipeModalBody"></div>
  </div>
</div>

// ===== タブ切替 =====
function switchTab(tab) {
  currentTab = tab;
  var tabs = ['catalog','recipe','builder'];
  for (var i=0;i<tabs.length;i++) {
    var t = tabs[i];
    document.getElementById('tab-'+t).className = 'tab-btn' + (t===tab?' active':'');
  }
  document.getElementById('view-catalog').style.display = (tab==='catalog')?'':'none';
  document.getElementById('view-recipe').style.display = (tab==='recipe')?'':'none';
  document.getElementById('view-builder').style.display = (tab==='builder')?'':'none';
  document.querySelector('.search-bar').style.display = (tab==='catalog')?'':'none';
  document.querySelector('.count-bar').style.display = (tab==='catalog')?'':'none';
}

// ===== 検索 =====
function expandQuery(q) {
  var terms = [q];
  if (SYNONYMS[q]) {
    var syns = SYNONYMS[q];
    for (var i=0;i<syns.length;i++) terms.push(syns[i].toLowerCase());
  }
  // partial match on synonym keys
  for (var key in SYNONYMS) {
    if (key.indexOf(q)>=0 || q.indexOf(key)>=0) {
      var s2 = SYNONYMS[key];
      for (var j=0;j<s2.length;j++) terms.push(s2[j].toLowerCase());
    }
  }
  return terms;
}

function oilMatches(o, terms) {
  var haystack = (o.ja+o.en+o.benefits.join('')+o.scenes.join('')+o.emotions.join('')+o.desc+o.note).toLowerCase();
  for (var i=0;i<terms.length;i++) {
    if (haystack.indexOf(terms[i])>=0) return true;
  }
  return false;
}

document.getElementById('searchInput').addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  if (!q) { renderCards(OILS); return; }
  var terms = expandQuery(q);
  var filtered = OILS.filter(function(o){ return oilMatches(o, terms); });
  renderCards(filtered);
});

function scls(v){return v==='○'?'s-ok':v==='△'?'s-warn':'s-ng';}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderOilSelector() {
  var h='';
  for(var i=0;i<OILS.length;i++){
    var o=OILS[i];
    var sel=selectedOils.indexOf(o.ja)>=0;
    h+='<button class="oil-select-btn'+(sel?' selected':'')+'" onclick="toggleOil(\''+esc(o.ja)+'\')">'+esc(o.ja)+'</button>';
  }
  document.getElementById('oilSelector').innerHTML=h;
}

function toggleOil(name) {
  var idx=selectedOils.indexOf(name);
  if(idx>=0){
    selectedOils.splice(idx,1);
    delete ratios[name];
  } else {
    if(selectedOils.length>=5){alert('最大5種まで選択できます');return;}
    selectedOils.push(name);
    ratios[name]=2;
  }
  renderOilSelector();
  renderBuilderSelected();
  renderResult();
}

function renderBuilderSelected() {
  var h='';
  if(!selectedOils.length){
    h='<p style="font-size:13px;color:var(--sub);padding:8px 0">上のリストからオイルを選択してください</p>';
    document.getElementById('builderSelected').innerHTML=h;
    return;
  }
  for(var i=0;i<selectedOils.length;i++){
    var name=selectedOils[i];
    var r=ratios[name]||1;
    h+='<div class="builder-oil-row">';
    h+='<span class="builder-oil-name">'+esc(name)+'</span>';

    h+='<span class="ratio-val" id="rv-'+i+'">'+r+'</span>';
    h+='<button class="ratio-btn" onclick="changeRatio(\''+esc(name)+'\',1)">+</button>';
    h+='</div>';
    h+='<button class="builder-remove" onclick="toggleOil(\''+esc(name)+'\')">✕</button>';
    h+='</div>';
  }
  document.getElementById('builderSelected').innerHTML=h;
}

function changeRatio(name,delta){
  ratios[name]=Math.max(1,Math.min(10,(ratios[name]||1)+delta));
  renderBuilderSelected();
  renderResult();
}

function setRecommendedDrops(n){
  document.getElementById('totalDrops').value=n;
  renderResult();
}
function renderResult(){
  var total=0;
  for(var i=0;i<selectedOils.length;i++) total+=ratios[selectedOils[i]]||1;
  var drops=parseInt(document.getElementById('totalDrops').value)||6;
  if(!selectedOils.length){
    document.getElementById('resultArea').innerHTML='<p style="font-size:13px;color:var(--sub)">オイルを選ぶと滴数が計算されます</p>';
    return;
  }
  var exact=[];
  var sumFloor=0;
  for(var i=0;i<selectedOils.length;i++){
    var r=ratios[selectedOils[i]]||1;
    var e=r/total*drops;
    exact.push({name:selectedOils[i],val:e,floor:Math.floor(e),rem:e-Math.floor(e),ratio:r});
    sumFloor+=Math.floor(e);
  }
  var remainder=drops-sumFloor;
  exact.sort(function(a,b){return b.rem-a.rem;});
  for(var i=0;i<remainder;i++) exact[i].floor+=1;
  exact.sort(function(a,b){return b.val-a.val;});
  var maxDiff=0;
  for(var i=0;i<exact.length;i++){
    var diff=Math.abs(exact[i].floor/drops*100 - exact[i].ratio/total*100);
    if(diff>maxDiff) maxDiff=diff;
  }
  var h='';
  if(maxDiff>5){
    h+='<div class="warn-box">';
    h+='<span class="warn-text">&#9888; この比率を正確に表すには <strong>'+total+'滴</strong> が最適です</span>';
    h+='<button class="warn-btn" onclick="setRecommendedDrops('+total+')">→ '+total+'滴に変更する</button>';
    h+='</div>';
  }
  h+='<div class="result-list">';
  for(var i=0;i<exact.length;i++){
    var item=exact[i];
    var pct=Math.round(item.floor/drops*100);
    h+='<div class="result-row">';
    h+='<span class="result-oil">'+esc(item.name)+'</span>';
    h+='<span class="result-drops">'+item.floor+'<span> 滴</span></span>';
    h+='<span class="result-pct">'+pct+'%</span>';
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('resultArea').innerHTML=h;
}

document.getElementById('totalDrops').addEventListener('input',renderResult);

function loadRecipeToBuilder(id){
  closeModal();
  var r=null;
  for(var i=0;i<RECIPES.length;i++){if(RECIPES[i].id===id){r=RECIPES[i];break;}}
  if(!r)return;
  selectedOils=[];
  ratios={};
  for(var i=0;i<r.oils.length;i++){
    selectedOils.push(r.oils[i].name);
    ratios[r.oils[i].name]=r.oils[i].ratio;
  }
  switchTab('builder');
  renderOilSelector();
  renderBuilderSelected();
  renderResult();
}

// 初期化
renderCards(OILS);
renderRecipes();
renderOilSelector();
renderBuilderSelected();
renderResult();

</script>
